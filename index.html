<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name = "viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css"/>
    <script src="index.js"></script>
</head>
<body onload = loading()>

<div class="calc">
    <div class ="src">
        <div id = "exp"></div>
    </div>

    <div id="bigBox">
    <input id="input" type ='text'/>
    <div id="output"></div>
    </div>

    <div class = "nav">
        <button class="b bUp" onclick="goUp('UP')" > ↑</button>
        <button class="b bUp" onclick="goDown('DOWN')" > ↓</button>
    </div>

    <div class="pad">
<!--row 1-->
        <button id="(" onclick = "handleInput('(')">(</button>
        <button id=")" onclick = "handleInput(')')">)</button>
        <button id="**" onclick = "handleInput('**')">**</button>
        <button id="*" onclick = "handleInput('*')">*</button>

    <!--row 2-->
        <button id="7" onclick = "handleInput('7')">7</button>
        <button id="8" onclick = "handleInput('8')">8</button>
        <button id="9" onclick = "handleInput('9')">9</button>
        <button id="/" onclick = "handleInput('/')">/</button>

    <!--row 3-->
        <button id="4" onclick = "handleInput('4')">4</button>
        <button id="5" onclick = "handleInput('5')">5</button>
        <button id="6" onclick = "handleInput('6')">6</button>
        <button id="-" onclick = "handleInput('-')">-</button>

    <!--row 4-->
        <button id="1" onclick = "handleInput('1')">1</button>
        <button id="2" onclick = "handleInput('2')">2</button>
        <button id="3" onclick = "handleInput('3')">3</button>
        <button id="+" onclick = "handleInput('+')">+</button>

    <!--row 5-->
        <button id="MOD" onclick = "handleInput('%')">%</button>
        <button id="0" onclick = "handleInput('0')">0</button>
        <button id="." onclick = "handleInput('.')">.</button>
        <button id="=" onclick = "calculate()">=</button>


    </div>
</div>

<script src="index.html"></script>

</body>
</html>
